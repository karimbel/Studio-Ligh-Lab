name: studio-ligh-lab

services:
  web:
    container_name: Studio-Ligh-Lab
    build:
      context: .
      target: development
    ports:
      - "5174:5173"
    volumes:
      - .:/app
      - studio_ligh_lab_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    pids_limit: 128

volumes:
  studio_ligh_lab_node_modules:
